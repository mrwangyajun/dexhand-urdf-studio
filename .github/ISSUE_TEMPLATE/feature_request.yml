name: 功能建议
description: 提出新功能或改进现有行为
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看 README 的「已知限制」与「下一步建议（backlog）」，有些想法已经在计划里了。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: 描述工作流里卡住的地方，而不是直接给方案
      placeholder: 我们一次要处理 20 个零件，逐个粘质量属性太慢，希望能一表导入
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想怎么用、界面上长什么样、数据从哪来
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我的用法，可以加个开关
        - 需要改数据模型 / 工程文件格式
        - 需要新依赖
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我可以提 PR 实现
        - label: 我可以提供示例数据或测试用例
